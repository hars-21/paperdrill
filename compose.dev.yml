services:
  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: ./backend/.env.development
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgres
      - redis

  engine:
    build:
      context: ./engine
      target: dev
    restart: unless-stopped
    env_file: ./engine/.env.development
    volumes:
      - ./engine:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - redis

  worker:
    build:
      context: ./worker
      target: dev
    restart: unless-stopped
    env_file: ./worker/.env.development
    volumes:
      - ./worker:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgres
      - redis

  postgres:
    image: timescale/timescaledb:2.28.2-pg17
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  postgres_data:
