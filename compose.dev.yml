x-dev-bot: &dev-bot
  build: ./bot
  env_file: ./.env.dev
  profiles: ["bots"]
  restart: on-failure:5
  depends_on:
    backend:
      condition: service_healthy

services:
  backend:
    build:
      context: ./backend
      target: dev
    env_file: ./.env.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  engine:
    build:
      context: ./engine
      target: dev
    env_file: ./.env.dev
    volumes:
      - ./engine:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      target: dev
    env_file: ./.env.dev
    volumes:
      - ./worker:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: timescale/timescaledb:2.28.2-pg17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: paperdrill
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paperdrill"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    ports:
      - "6380:6379"

  btc-bot:
    <<: *dev-bot
    environment:
      BASE_URL: http://backend:8000
      MARKET: BTC_USD
      SERVICE_EMAIL: btc.service@paperdrill.dev
      MAX_ORDER_QTY: 0.1

  sol-bot:
    <<: *dev-bot
    environment:
      BASE_URL: http://backend:8000
      MARKET: SOL_USD
      SERVICE_EMAIL: sol.service@paperdrill.dev
      MAX_ORDER_QTY: 10

  eth-bot:
    <<: *dev-bot
    environment:
      BASE_URL: http://backend:8000
      MARKET: ETH_USD
      SERVICE_EMAIL: eth.service@paperdrill.dev
      MAX_ORDER_QTY: 1

volumes:
  postgres-data:
