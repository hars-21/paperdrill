x-test-app: &test-app
  env_file: ./.env.test
  healthcheck:
    interval: 2s
    timeout: 5s
    retries: 20

services:
  postgres:
    image: timescale/timescaledb:2.28.2-pg17
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: paperdrill_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paperdrill_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    ports:
      - "6381:6379"
    healthcheck:
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /data

  backend:
    <<: *test-app
    build:
      context: ./backend
      target: runner
    ports:
      - "8001:8000"

  engine:
    <<: *test-app
    build:
      context: ./engine
      target: runner
    tmpfs:
      - /usr/src/app/snapshots

  worker:
    <<: *test-app
    build:
      context: ./worker
      target: runner
