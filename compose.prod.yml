services:
  backend:
    build:
      context: ./backend
      target: runner
    restart: unless-stopped
    expose:
      - 8000
    env_file: ./.env.prod
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r = await fetch('http://localhost:8000/health'); if (!r.ok) process.exit(1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - paperdrill

  engine:
    build:
      context: ./engine
      target: runner
    restart: unless-stopped
    env_file: ./.env.prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - engine-snapshots:/usr/src/app/snapshots
    networks:
      - paperdrill

  worker:
    build:
      context: ./worker
      target: runner
    restart: unless-stopped
    env_file: ./.env.prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - paperdrill

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - paperdrill

  redis:
    image: redis:7.2
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --tcp-keepalive 60 --appendfsync everysec --auto-aof-rewrite-percentage 100 --auto-aof-rewrite-min-size 64mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - redis-data:/data
    networks:
      - paperdrill

volumes:
  engine-snapshots:
  redis-data:

networks:
  paperdrill:
    name: paperdrill-network
    external: true
