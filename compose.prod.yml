x-prod-runtime: &prod-runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-prod-app: &prod-app
  <<: *prod-runtime
  env_file: ./.env.prod

x-bot-service: &bot-service
  <<: *prod-app
  image: "ghcr.io/hars-21/paperdrill-bot:${PAPERDRILL_IMAGE_TAG:?Set PAPERDRILL_IMAGE_TAG in .env.prod}"
  profiles: ["bots"]
  restart: on-failure:5
  depends_on:
    backend:
      condition: service_healthy

services:
  backend:
    <<: *prod-app
    image: "ghcr.io/hars-21/paperdrill-backend:${PAPERDRILL_IMAGE_TAG:?Set PAPERDRILL_IMAGE_TAG in .env.prod}"
    depends_on:
      postgres:
        condition: service_healthy

  engine:
    <<: *prod-app
    image: "ghcr.io/hars-21/paperdrill-engine:${PAPERDRILL_IMAGE_TAG:?Set PAPERDRILL_IMAGE_TAG in .env.prod}"
    volumes:
      - engine-snapshots:/usr/src/app/snapshots
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *prod-app
    image: "ghcr.io/hars-21/paperdrill-worker:${PAPERDRILL_IMAGE_TAG:?Set PAPERDRILL_IMAGE_TAG in .env.prod}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    <<: *prod-runtime
    image: timescale/timescaledb:2.28.2-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paperdrill}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    <<: *prod-runtime
    image: redis:7.2
    command: redis-server --appendonly yes --maxmemory 768mb --maxmemory-policy noeviction --tcp-keepalive 60 --appendfsync everysec --auto-aof-rewrite-percentage 100 --auto-aof-rewrite-min-size 64mb
    volumes:
      - redis-data:/data

  nginx:
    <<: *prod-runtime
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  btc-bot:
    <<: *bot-service
    environment:
      MARKET: BTC_USD
      SERVICE_EMAIL: btc.service@paperdrill.dev
      MAX_ORDER_QTY: 0.1

  sol-bot:
    <<: *bot-service
    environment:
      MARKET: SOL_USD
      SERVICE_EMAIL: sol.service@paperdrill.dev
      MAX_ORDER_QTY: 10

  eth-bot:
    <<: *bot-service
    environment:
      MARKET: ETH_USD
      SERVICE_EMAIL: eth.service@paperdrill.dev
      MAX_ORDER_QTY: 1

volumes:
  engine-snapshots:
  postgres-data:
  redis-data:
