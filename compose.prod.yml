services:
  backend:
    build:
      context: ./backend
      target: runner
    restart: unless-stopped
    expose:
      - 8000
    env_file: ./backend/.env.production
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  engine:
    build:
      context: ./engine
      target: runner
    restart: unless-stopped
    env_file: ./engine/.env.production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ./worker
      target: runner
    restart: unless-stopped
    env_file: ./worker/.env.production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
